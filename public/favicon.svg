<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d11"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <radialGradient id="lift" cx="50%" cy="12%" r="66%">
      <stop offset="0" stop-color="#2a2a35"/>
      <stop offset="1" stop-color="#2a2a35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <rect width="64" height="64" fill="url(#lift)"/>
  <!-- A top hat: the crown and brim, with the ribbon band cut back out of them.
       Geometry matches scripts/make-icons.mjs, so the tab and the home screen agree. -->
  <mask id="band">
    <rect width="64" height="64" fill="#000"/>
    <rect x="21.12" y="13.44" width="21.76" height="31.36" rx="3.97" fill="#fff"/>
    <rect x="8" y="40.51" width="48" height="6.66" rx="3.33" fill="#fff"/>
    <rect x="21.12" y="35.39" width="21.76" height="2.82" fill="#000"/>
  </mask>
  <rect width="64" height="64" fill="#eceaf2" mask="url(#band)"/>
</svg>
